<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabelmodem</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --grid:#eef0f3;
  --good:#1f9d55; --warn:#d99a06; --bad:#d64545; --accent:#2f6fde; --accent2:#8a5cd1;
  --band:rgba(47,111,222,.16); --goodbg:rgba(31,157,85,.08); --warnbg:rgba(217,154,6,.09); --badbg:rgba(214,69,69,.08);
  --tol:#7fb93a; --tolbg:rgba(127,185,58,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --card:#1a1e26; --fg:#e6e8ec; --muted:#9aa1ad; --line:#2a303b; --grid:#222833;
    --good:#3ccf7d; --warn:#f0b429; --bad:#f06464; --accent:#5b93f5; --accent2:#a985ec;
    --band:rgba(91,147,245,.2); --goodbg:rgba(60,207,125,.07); --warnbg:rgba(240,180,41,.08); --badbg:rgba(240,100,100,.08);
    --tol:#a3d65c; --tolbg:rgba(163,214,92,.08);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--grid)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--good)} .pill.err i{background:var(--bad)}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:5px 12px;border-radius:7px;cursor:pointer}
button:hover{border-color:var(--accent)} button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:20px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--muted);font-size:12px;margin-top:1px}
.v.good{color:var(--good)} .v.tol{color:var(--tol)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section h2 small{color:var(--muted);font-weight:400;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chart{width:100%;min-height:60px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ttl{font-size:12px;color:var(--muted);margin-bottom:2px}
svg text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
.good{color:var(--good)} .tol{color:var(--tol)} .warn{color:var(--warn)} .bad{color:var(--bad)}
tr.lv-bad td{background:var(--badbg)} tr.lv-warn td{background:var(--warnbg)}
details{margin-top:8px} summary{cursor:pointer;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.err{color:var(--bad);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;z-index:10;display:none;white-space:nowrap}
.muted{color:var(--muted)}
@media (max-width:600px){header,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <h1>Kabelmodem</h1>
  <span class="sub" id="model">–</span>
  <span class="pill" id="pill"><i></i><span>verbinde…</span></span>
  <span class="spacer"></span>
  <span class="sub" id="updated"></span>
  <button id="refresh" title="Modem sofort abfragen">Jetzt abfragen</button>
</header>
<main>
  <div id="error" class="err" style="margin-bottom:12px"></div>
  <div class="tiles" id="tiles"></div>
  <div class="legend" style="margin:-6px 0 16px">
    <span style="--c:var(--good)">Regel-/Vorgabekonform</span><span style="--c:var(--tol)">Tolerierte Abweichung</span>
    <span style="--c:var(--warn)">Beseitigung binnen Monatsfrist</span><span style="--c:var(--bad)">Sofortige Beseitigung</span>
    <span class="muted" id="limNote" style="margin-left:auto"></span>
  </div>

  <section>
    <h2>Downstream <small id="dsSub"></small></h2>
    <div class="grid2">
      <div class="chart" id="dsPower"></div>
      <div class="chart" id="dsSnr"></div>
    </div>
    <details><summary>Kanaltabelle</summary><div class="tablewrap" id="dsTable"></div></details>
  </section>

  <section>
    <h2>Upstream <small id="usSub"></small></h2>
    <div class="grid2">
      <div class="chart" id="usPower"></div>
      <div class="tablewrap" id="usTable" style="margin-top:0"></div>
    </div>
  </section>

  <section>
    <h2>Verlauf
      <span id="ranges">
        <button data-h="6">6 h</button><button data-h="24" class="on">24 h</button><button data-h="168">7 Tage</button><button data-h="720">30 Tage</button>
      </span>
      <small id="histSub"></small>
    </h2>
    <div class="grid2">
      <div class="chart" id="hDsPower"></div>
      <div class="chart" id="hDsSnr"></div>
      <div class="chart" id="hErr"></div>
      <div class="chart" id="hUsPower"></div>
      <div class="chart" id="hTemp"></div>
    </div>
  </section>

  <section id="startupSec" style="display:none">
    <h2>Verbindungsaufbau</h2>
    <div class="tablewrap" id="startup"></div>
  </section>

  <section>
    <h2>Ereignisprotokoll <small id="evSub"></small></h2>
    <div class="tablewrap" id="events" style="max-height:420px;overflow:auto"></div>
  </section>

  <section>
    <h2>Geräteinformationen</h2>
    <div class="tablewrap" id="device"></div>
    <details id="otherWrap" style="display:none"><summary>Weitere Tabellen vom Modem</summary><div id="other"></div></details>
  </section>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
// ---------------------------------------------------------------- Grenzwerte
// Grenzwerte digital in BK-Netzen (Tabelle "Meister Voda", Stand 2018-06-17), alles in dBmV bzw. dB.
// Stufen: good = Regel-/Vorgabekonform, tol = Tolerierte Abweichung,
//         warn = Beseitigung binnen Monatsfrist, bad = Sofortige Beseitigung.
// Format: [Obergrenze (inklusive), Stufe] aufsteigend.
const R = {
  dsPower: {
    64:   [[-14, "bad"], [-12, "warn"], [-10, "tol"], [7, "good"], [12, "tol"], [14, "warn"], [Infinity, "bad"]],
    256:  [[-8, "bad"], [-6, "warn"], [-4, "tol"], [13, "good"], [18, "tol"], [20, "warn"], [Infinity, "bad"]],
    1024: [[-6, "bad"], [-4, "warn"], [-2, "tol"], [15, "good"], [20, "tol"], [22, "warn"], [Infinity, "bad"]],
    2048: [[-4, "bad"], [-2, "warn"], [0, "tol"], [17, "good"], [22, "tol"], [24, "warn"], [Infinity, "bad"]],
    4096: [[-2, "bad"], [0, "warn"], [2, "tol"], [19, "good"], [24, "tol"], [26, "warn"], [Infinity, "bad"]],
  },
  snr: {
    64:   [[24, "bad"], [26, "warn"], [27, "tol"], [Infinity, "good"]],
    256:  [[30, "bad"], [32, "warn"], [33, "tol"], [Infinity, "good"]],
    1024: [[36, "bad"], [38, "warn"], [39, "tol"], [Infinity, "good"]],
    2048: [[39, "bad"], [41, "warn"], [42, "tol"], [Infinity, "good"]],
    4096: [[42, "bad"], [44, "warn"], [45, "tol"], [Infinity, "good"]],
  },
  // Sendepegel: Spalte "DOCSIS 3.1 Modem" (der FAST3893 ist ein 3.1-Modem)
  usPower: [[38, "bad"], [40, "warn"], [44, "tol"], [47, "good"], [48, "tol"], [50, "warn"], [Infinity, "bad"]],
};
// Das Modem meldet für OFDM keine QAM-Stufe. Bewertet wird nach dieser Stufe (1024, 2048 oder 4096):
const OFDM_QAM = 1024;
const qamOf = (ofdm, mod) => ofdm ? OFDM_QAM : /\b64/.test(mod || "") ? 64 : 256;
const classify = (v, ranges) => v == null ? "" : ranges.find(r => v <= r[0])[1];
const LIM = {
  dsPower: (v, ofdm, mod) => classify(v, R.dsPower[qamOf(ofdm, mod)]),
  dsSnr:   (v, ofdm, mod) => classify(v, R.snr[qamOf(ofdm, mod)]),
  // Für OFDMA enthält die Tabelle keine Werte: neutral darstellen
  usPower: (v, ofdm) => ofdm ? "accent" : classify(v, R.usPower),
};
const toBands = ranges => ranges.map((r, i) => [i ? ranges[i - 1][0] : -1000, Math.min(r[0], 1000), r[1]]);
const BANDS = {
  dsPower: toBands(R.dsPower[256]),
  dsSnr:   toBands(R.snr[256]),
  usPower: toBands(R.usPower),
};
const STUFE = {good: "Regel-/Vorgabekonform", tol: "Tolerierte Abweichung", warn: "Beseitigung binnen Monatsfrist", bad: "Sofortige Beseitigung"};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = v => v == null ? "–" : (Math.round(v * 10) / 10).toLocaleString("de-DE", {minimumFractionDigits: 1, maximumFractionDigits: 1});
const fint = v => v == null ? "–" : Math.round(v).toLocaleString("de-DE");
const tip = $("tip");
function showTip(e, html){ tip.innerHTML = html; tip.style.display = "block";
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (e.clientY - 34) + "px"; }
function hideTip(){ tip.style.display = "none"; }

// ---------------------------------------------------------------- SVG-Helfer
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function niceTicks(min, max, n){
  const span = max - min || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

// Balkendiagramm: items [{label, value, cls, tip}]
function barChart(box, title, items, opt){
  box.innerHTML = `<div class="ttl">${esc(title)}</div>`;
  if (!items.length){ box.insertAdjacentHTML("beforeend", '<div class="muted">keine Daten</div>'); return; }
  const W = Math.max(280, box.clientWidth), H = opt.height || 200, L = 34, R = 6, T = 6, B = 34;
  const vals = items.map(i => i.value).filter(v => v != null);
  let lo = Math.min(opt.min ?? Infinity, ...vals), hi = Math.max(opt.max ?? -Infinity, ...vals);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H}, box);
  for (const [a, b, c] of opt.bands || []){
    const y1 = y(Math.min(Math.max(b, lo), hi)), y2 = y(Math.max(Math.min(a, hi), lo));
    if (y2 > y1) el("rect", {x: L, y: y1, width: W - L - R, height: y2 - y1, fill: css(`--${c}bg`)}, svg);
  }
  for (const t of niceTicks(lo, hi, 5)){
    el("line", {x1: L, x2: W - R, y1: y(t), y2: y(t), stroke: css("--grid")}, svg);
    el("text", {x: L - 5, y: y(t) + 3.5, "text-anchor": "end"}, svg).textContent = t;
  }
  const base = y(Math.max(lo, Math.min(hi, opt.base ?? (lo < 0 && hi > 0 ? 0 : lo))));
  const n = items.length, bw = (W - L - R) / n, gap = Math.min(4, bw * 0.25);
  const every = Math.ceil(n / Math.floor((W - L - R) / 34));
  items.forEach((it, i) => {
    const x = L + i * bw + gap / 2;
    if (it.value != null){
      const yv = y(it.value), r = el("rect", {x, y: Math.min(yv, base), width: Math.max(1, bw - gap),
        height: Math.max(1, Math.abs(base - yv)), rx: 2, fill: css(`--${it.cls || "accent"}`)}, svg);
      r.addEventListener("mousemove", e => showTip(e, it.tip)); r.addEventListener("mouseleave", hideTip);
    }
    if (i % every === 0){
      el("text", {x: x + (bw - gap) / 2, y: H - B + 13, "text-anchor": "middle"}, svg).textContent = it.label;
      if (it.label2) el("text", {x: x + (bw - gap) / 2, y: H - B + 25, "text-anchor": "middle"}, svg).textContent = it.label2;
    }
  });
}

// Zeitreihe: series [{name, color, pts:[[t,v]], band:[[t,lo,hi]]}]
function lineChart(box, title, series, opt){
  box.innerHTML = `<div class="ttl">${esc(title)}</div>`;
  const all = series.flatMap(s => (s.pts || []).map(p => p[1]).concat((s.band || []).flatMap(b => [b[1], b[2]]))).filter(v => v != null);
  if (!all.length){ box.insertAdjacentHTML("beforeend", '<div class="muted">noch keine Verlaufsdaten</div>'); return; }
  const W = Math.max(280, box.clientWidth), H = opt.height || 170, L = 40, R = 8, T = 6, B = 22;
  let lo = Math.min(opt.min ?? Infinity, ...all), hi = Math.max(opt.max ?? -Infinity, ...all);
  if (opt.zero) lo = Math.min(0, lo);
  const pad = (hi - lo) * 0.08 || 1; if (!opt.zero) lo -= pad; hi += pad;
  const t0 = opt.t0, t1 = opt.t1;
  const x = t => L + (W - L - R) * (t - t0) / (t1 - t0), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H}, box);
  for (const [a, b, c] of opt.bands || []){
    const y1 = y(Math.min(Math.max(b, lo), hi)), y2 = y(Math.max(Math.min(a, hi), lo));
    if (y2 > y1) el("rect", {x: L, y: y1, width: W - L - R, height: y2 - y1, fill: css(`--${c}bg`)}, svg);
  }
  if (opt.zero) hi = Math.max(hi, 4);
  for (const t of niceTicks(lo, hi, 4).filter(t => !opt.zero || Number.isInteger(t))){
    el("line", {x1: L, x2: W - R, y1: y(t), y2: y(t), stroke: css("--grid")}, svg);
    el("text", {x: L - 5, y: y(t) + 3.5, "text-anchor": "end"}, svg).textContent = opt.fmt ? opt.fmt(t) : t;
  }
  const span = t1 - t0, long = span > 2 * 86400;
  const tstep = [600, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800].find(s => span / s <= Math.max(3, (W - L) / 90)) || 604800;
  const tz = new Date().getTimezoneOffset() * 60;
  for (let t = Math.ceil((t0 - tz) / tstep) * tstep + tz; t <= t1; t += tstep){
    const d = new Date(t * 1000);
    el("line", {x1: x(t), x2: x(t), y1: T, y2: H - B, stroke: css("--grid")}, svg);
    el("text", {x: x(t), y: H - 6, "text-anchor": "middle"}, svg).textContent =
      long ? d.toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit"}) : d.toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
  }
  const gap = opt.gap || Infinity;
  const path = pts => { let d = "", prev = null;
    for (const [t, v] of pts){ if (v == null){ prev = null; continue; }
      d += (prev == null || t - prev > gap ? "M" : "L") + x(t).toFixed(1) + "," + y(v).toFixed(1); prev = t; }
    return d; };
  for (const s of series){
    if (s.band && s.band.length){
      // Band als Polygon je zusammenhängendem Abschnitt
      let seg = [];
      const flush = () => { if (seg.length > 1){
        const d = seg.map((b, i) => (i ? "L" : "M") + x(b[0]).toFixed(1) + "," + y(b[2]).toFixed(1)).join("") +
          seg.slice().reverse().map(b => "L" + x(b[0]).toFixed(1) + "," + y(b[1]).toFixed(1)).join("") + "Z";
        el("path", {d, fill: s.bandColor || css("--band"), stroke: "none"}, svg); }
        seg = []; };
      let prev = null;
      for (const b of s.band){ if (b[1] == null){ flush(); prev = null; continue; }
        if (prev != null && b[0] - prev > gap) flush(); seg.push(b); prev = b[0]; }
      flush();
    }
    if (s.bars){
      const bw = Math.max(1, (W - L - R) * opt.bucket / (t1 - t0) - 0.5);
      for (const [t, v] of s.pts) if (v) el("rect", {x: x(t), y: y(v), width: bw, height: Math.max(1, y(lo) - y(v)), fill: s.color}, svg);
    } else if (s.pts){
      el("path", {d: path(s.pts), fill: "none", stroke: s.color, "stroke-width": s.width || 1.6, "stroke-linejoin": "round"}, svg);
      // Einzelpunkte (z. B. direkt nach dem Start) sichtbar machen
      const v = s.pts.filter(p => p[1] != null);
      v.forEach((p, i) => { const iso = (i === 0 || p[0] - v[i - 1][0] > gap) && (i === v.length - 1 || v[i + 1][0] - p[0] > gap);
        if (iso) el("circle", {cx: x(p[0]), cy: y(p[1]), r: 2.5, fill: s.color}, svg); });
    }
  }
  // Hover-Linie
  const hover = el("line", {y1: T, y2: H - B, stroke: css("--muted"), "stroke-dasharray": "3 3", visibility: "hidden"}, svg);
  const hit = el("rect", {x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent"}, svg);
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const t = t0 + (px - L) / (W - L - R) * (t1 - t0);
    const lines = [];
    let tt = null;
    for (const s of series){
      const arr = s.pts || s.band; if (!arr || !arr.length) continue;
      let best = arr[0]; for (const p of arr) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
      if (Math.abs(best[0] - t) > (opt.bucket || 60) * 2) continue;
      tt = best[0];
      if (s.pts) lines.push(`<b style="color:${s.color}">●</b> ${esc(s.name)}: ${opt.fmt ? opt.fmt(best[1]) : f1(best[1])}${opt.unit || ""}`);
      if (s.band && !s.pts) lines.push(`${esc(s.name)}: ${f1(best[1])} … ${f1(best[2])}${opt.unit || ""}`);
      else if (s.band){ const b = s.band.find(q => q[0] === best[0]); if (b) lines.push(`<span style="opacity:.75">Spanne ${f1(b[1])} … ${f1(b[2])}</span>`); }
    }
    if (tt == null){ hover.setAttribute("visibility", "hidden"); hideTip(); return; }
    hover.setAttribute("x1", x(tt)); hover.setAttribute("x2", x(tt)); hover.setAttribute("visibility", "visible");
    showTip(e, new Date(tt * 1000).toLocaleString("de-DE", {weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) + "<br>" + lines.join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { hover.setAttribute("visibility", "hidden"); hideTip(); });
  if (opt.legend) box.insertAdjacentHTML("beforeend", `<div class="legend">${series.filter(s => s.name).map(s => `<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>`);
}

// ---------------------------------------------------------------- Aktueller Zustand
let state = null, hist = null, hours = 24;

function tile(k, v, s, cls){ return `<div class="tile"><div class="k">${esc(k)}</div><div class="v ${cls || ""}">${v}</div><div class="s">${s || ""}</div></div>`; }
function worst(classes){ classes = classes.filter(c => STUFE[c]);
  return ["bad", "warn", "tol", "good"].find(c => classes.includes(c)) || ""; }
function locked(c){ return !c.lock || /lock/i.test(c.lock) && !/not|unlock/i.test(c.lock); }

function renderState(){
  const s = state; if (!s) return;
  const sw = s.swinfo || {}, info = s.info || {};
  const st = s.status || {ds: [], us: [], startup: [], other: []};
  $("model").textContent = [sw["Hardware Version"] || info["Board ID"], sw["Software Version"] || info["Software Version"]].filter(Boolean).join(" · ") || "–";
  const pill = $("pill");
  pill.className = "pill " + (s.ok ? "ok" : "err");
  pill.lastElementChild.textContent = s.ok ? "verbunden" : "Fehler";
  $("error").textContent = s.ok ? "" : "Letzte Abfrage fehlgeschlagen: " + (s.error || "?");
  $("updated").textContent = s.updated ? `Stand ${new Date(s.updated * 1000).toLocaleTimeString("de-DE")} · Abfrage ${f1(s.duration)} s · alle ${s.interval} s` : "";

  const ds = st.ds.slice().sort((a, b) => (a.freq ?? 0) - (b.freq ?? 0));
  const us = st.us.slice().sort((a, b) => (a.freq ?? 0) - (b.freq ?? 0));
  const dsQ = ds.filter(c => !c.ofdm), dsO = ds.filter(c => c.ofdm), usQ = us.filter(c => !c.ofdm), usO = us.filter(c => c.ofdm);
  const mm = (arr, k) => { const v = arr.map(c => c[k]).filter(x => x != null); return v.length ? [Math.min(...v), Math.max(...v)] : null; };

  // Kacheln
  const dsP = mm(ds, "power"), dsS = mm(dsQ, "snr"), dsSo = mm(dsO, "snr"), usP = mm(us, "power");
  const uncorr = ds.reduce((a, c) => a + (c.uncorr || 0), 0), corr = dsQ.reduce((a, c) => a + (c.corr || 0), 0);
  const ev = s.events || [];
  const dayAgo = Date.now() - 86400e3;
  const crit = ev.filter(e => e.level != null && e.level <= 3 && Date.parse((e.last || "").replace(" ", "T")) > dayAgo);
  const t3t4 = ev.filter(e => /T3 time|T4 time/i.test(e.text) && Date.parse((e.last || "").replace(" ", "T")) > dayAgo);
  const temp = parseFloat(sw["Board Temperature"]);
  const unlocked = ds.concat(us).filter(c => !locked(c)).length;
  $("tiles").innerHTML = [
    tile("Netzzugang", esc(sw["Network Access"] || "–"), "Uptime " + esc((sw["System Up Time"] || info["Uptime"] || "–").replace(/ days?/, " T").replace(/ hours?/, " h").replace(/ mins?/, " min").replace(/ secs?/, " s")),
      /allow/i.test(sw["Network Access"] || "") ? "good" : sw["Network Access"] ? "bad" : ""),
    tile("Downstream-Kanäle", `${dsQ.length}<span class="muted" style="font-size:14px"> + ${dsO.length} OFDM</span>`, unlocked ? `<span class="bad">${unlocked} nicht gelockt</span>` : "alle gelockt", unlocked ? "bad" : ""),
    tile("Downstream-Pegel", dsP ? `${f1(dsP[0])} … ${f1(dsP[1])}` : "–", "dBmV · konform −3,9 … 13,0 (256QAM)", dsP ? worst(ds.filter(c => c.power != null).map(c => LIM.dsPower(c.power, c.ofdm, c.mod))) : ""),
    tile("SNR / MER", dsS ? `min ${f1(dsS[0])}` : "–", dsSo ? `dB · OFDM min ${f1(dsSo[0])} dB` : "dB (SC-QAM)", worst(ds.filter(c => c.snr != null).map(c => LIM.dsSnr(c.snr, c.ofdm, c.mod)))),
    tile("Upstream-Pegel", usP ? `${f1(usP[0])} … ${f1(usP[1])}` : "–", `dBmV · ${usQ.length} SC-QAM + ${usO.length} OFDMA`, usP ? worst(us.filter(c => c.power != null).map(c => LIM.usPower(c.power, c.ofdm))) : ""),
    tile("Fehler seit Neustart", fint(uncorr), `unkorrigierbar · ${fint(corr)} korrigiert (SC-QAM)`, uncorr > 0 ? "warn" : "good"),
    tile("Ereignisse 24 h", `${crit.length}`, `kritisch (Level ≤3) · ${t3t4.length}× T3/T4`, crit.length || t3t4.length ? "bad" : "good"),
    tile("Temperatur", isNaN(temp) ? "–" : f1(temp) + " °C", "Board", isNaN(temp) ? "" : temp < 75 ? "good" : temp < 85 ? "warn" : "bad"),
  ].join("");

  // Downstream
  $("dsSub").textContent = ds.length ? `${dsQ.length} SC-QAM, ${dsO.length} OFDM · ${f1(ds[0]?.freq)}–${f1(ds[ds.length - 1]?.freq)} MHz` : "";
  $("limNote").textContent = `Grenzwerte nach BK-Tabelle · SC-QAM als 256QAM, OFDM als ${OFDM_QAM}QAM bewertet`;
  const chTip = c => `Kanal ${esc(c.ch)} · ${f1(c.freq)} MHz · ${esc(c.mod)}` +
    `<br>Pegel ${f1(c.power)} dBmV · ${STUFE[LIM.dsPower(c.power, c.ofdm, c.mod)] || "–"}` +
    `<br>SNR ${f1(c.snr)} dB · ${STUFE[LIM.dsSnr(c.snr, c.ofdm, c.mod)] || "–"}` +
    `<br>korr. ${fint(c.corr)} · unkorr. ${fint(c.uncorr)}`;
  barChart($("dsPower"), "Pegel (dBmV)", ds.map(c => ({label: c.ch, label2: c.freq != null ? Math.round(c.freq) : "", value: c.power,
    cls: locked(c) ? LIM.dsPower(c.power, c.ofdm, c.mod) : "bad", tip: chTip(c)})), {min: -6, max: 20, bands: BANDS.dsPower});
  barChart($("dsSnr"), "SNR / MER (dB)", ds.map(c => ({label: c.ch, label2: c.ofdm ? "OFDM" : (c.freq != null ? Math.round(c.freq) : ""), value: c.snr,
    cls: c.snr == null ? "accent" : LIM.dsSnr(c.snr, c.ofdm, c.mod), tip: chTip(c)})), {min: 28, max: 46, base: 0, bands: BANDS.dsSnr});
  $("dsTable").innerHTML = chanTable(ds, true);

  // Upstream
  $("usSub").textContent = us.length ? `${usQ.length} SC-QAM, ${usO.length} OFDMA` : "";
  barChart($("usPower"), "Sendepegel (dBmV)", us.map(c => ({label: c.ch, label2: c.freq != null ? f1(c.freq) : "", value: c.power,
    cls: locked(c) ? LIM.usPower(c.power, c.ofdm) : "bad", tip: `Kanal ${esc(c.ch)} · ${f1(c.freq)} MHz · ${esc(c.mod)}<br>Pegel ${f1(c.power)} dBmV`})),
    {min: 34, max: 52, base: 0, bands: BANDS.usPower, height: 200});
  $("usTable").innerHTML = chanTable(us, false);

  // Startup
  if (st.startup && st.startup.length){
    $("startupSec").style.display = "";
    $("startup").innerHTML = `<table><tr><th>Schritt</th><th class="l">Status</th><th class="l">Kommentar</th></tr>${st.startup.map(r =>
      `<tr><td>${esc(r.name)}</td><td class="l">${esc(r.status)}</td><td class="l">${esc(r.comment)}</td></tr>`).join("")}</table>`;
  }

  // Ereignisse
  $("evSub").textContent = ev.length ? `${ev.length} Einträge · Level 1–3 kritisch, 4–5 Warnung, 6+ Info` : "";
  $("events").innerHTML = ev.length ? `<table><tr><th>Zuletzt</th><th>Anzahl</th><th>Level</th><th class="l">Meldung</th></tr>${ev.map(e => {
    const cls = e.level == null ? "" : e.level <= 3 ? "lv-bad" : e.level <= 5 ? "lv-warn" : "";
    return `<tr class="${cls}"><td>${esc(e.last)}</td><td>${esc(e.count)}</td><td>${esc(e.level)}</td><td class="l">${esc(e.text)}</td></tr>`; }).join("")}</table>` : '<div class="muted">–</div>';

  // Gerät
  const kv = Object.assign({}, info, sw);
  $("device").innerHTML = `<table>${Object.entries(kv).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="l">${esc(v)}</td></tr>`).join("")}</table>`;
  if (st.other && st.other.length){
    $("otherWrap").style.display = "";
    $("other").innerHTML = st.other.map(t => `<h3 style="font-size:13px;margin:12px 0 4px">${esc(t.title)}</h3><div class="tablewrap"><table><tr>${t.header.map(h => `<th class="l">${esc(h)}</th>`).join("")}</tr>${t.rows.map(r => `<tr>${r.map(c => `<td class="l">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`).join("");
  }
}

function chanTable(rows, isDs){
  if (!rows.length) return '<div class="muted">keine Kanäle</div>';
  const head = isDs ? ["Kanal", "Lock", "Modulation", "Frequenz MHz", "Pegel dBmV", "SNR/MER dB", "Korrigiert", "Unkorrigierbar"]
                    : ["Kanal", "Lock", "Typ", "Frequenz MHz", "Breite", "Pegel dBmV"];
  return `<table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.map(c => {
    const lk = locked(c) ? "good" : "bad";
    const p = c.power == null ? "" : (isDs ? LIM.dsPower(c.power, c.ofdm, c.mod) : LIM.usPower(c.power, c.ofdm));
    const cells = isDs
      ? [esc(c.ch), `<span class="${lk}">${esc(c.lock || "–")}</span>`, esc(c.mod), f1(c.freq), `<span class="${p}">${f1(c.power)}</span>`,
         `<span class="${c.snr == null ? "" : LIM.dsSnr(c.snr, c.ofdm, c.mod)}">${f1(c.snr)}</span>`, fint(c.corr), `<span class="${c.uncorr ? "warn" : ""}">${fint(c.uncorr)}</span>`]
      : [esc(c.ch), `<span class="${lk}">${esc(c.lock || "–")}</span>`, esc(c.mod), f1(c.freq), esc(c.width || "–"), `<span class="${p}">${f1(c.power)}</span>`];
    return `<tr>${cells.map(x => `<td>${x}</td>`).join("")}</tr>`; }).join("")}</table>`;
}

// ---------------------------------------------------------------- Verlauf
function renderHist(){
  const h = hist; if (!h) return;
  const o = {t0: h.since, t1: h.now, bucket: h.bucket, gap: h.bucket * 3.5};
  const A = css("--accent"), B = css("--accent2"), G = css("--warn"), R = css("--bad");
  const ser = (k, i) => (h[k] || []).map(r => [r[0], r[i]]);
  const band = (k, a, b) => (h[k] || []).map(r => [r[0], r[a], r[b]]);
  $("histSub").textContent = h.bucket > 90 ? `je Punkt ${h.bucket >= 3600 ? f1(h.bucket / 3600) + " h" : Math.round(h.bucket / 60) + " min"} zusammengefasst` : "";
  lineChart($("hDsPower"), "Downstream-Pegel (dBmV): Mittel und Spanne aller Kanäle", [
    {name: "SC-QAM", color: A, pts: ser("ds", 2), band: band("ds", 1, 3)},
    {name: "OFDM", color: B, pts: ser("dso", 2)},
  ], {...o, unit: " dBmV", bands: BANDS.dsPower, legend: true});
  lineChart($("hDsSnr"), "SNR / MER (dB): schlechtester Kanal", [
    {name: "SC-QAM min", color: A, pts: ser("ds", 4), band: band("ds", 4, 5)},
    {name: "OFDM min", color: B, pts: ser("dso", 4)},
  ], {...o, unit: " dB", bands: BANDS.dsSnr, legend: true});
  // Fehler: korrigierte und unkorrigierbare Zuwächse je Bucket (SC-QAM + OFDM)
  // OFDM korrigiert per LDPC ständig Millionen Codewörter (normal) -> korrigierte nur für SC-QAM zeigen
  const sumErr = (i, keys) => { const m = new Map();
    for (const k of keys) for (const r of h[k] || []) m.set(r[0], (m.get(r[0]) || 0) + (r[i] || 0));
    return [...m.entries()].sort((a, b) => a[0] - b[0]); };
  lineChart($("hErr"), "Codewort-Fehler je Intervall (korrigiert: nur SC-QAM)", [
    {name: "korrigiert (SC-QAM)", color: G, pts: sumErr(6, ["ds"]), bars: true},
    {name: "unkorrigierbar (alle)", color: R, pts: sumErr(7, ["ds", "dso"]), bars: true},
  ], {...o, zero: true, fmt: fint, legend: true});
  lineChart($("hUsPower"), "Upstream-Sendepegel (dBmV): Mittel und Spanne", [
    {name: "SC-QAM", color: A, pts: ser("us", 2), band: band("us", 1, 3)},
    {name: "OFDMA", color: B, pts: ser("uso", 2)},
  ], {...o, unit: " dBmV", bands: BANDS.usPower, legend: true});
  lineChart($("hTemp"), "Temperatur (°C) und fehlgeschlagene Abfragen", [
    {name: "Temperatur", color: A, pts: (h.meta || []).map(r => [r[0], r[1]])},
  ], {...o, unit: " °C"});
  const fails = (h.meta || []).reduce((a, r) => a + r[2], 0);
  if (fails) $("hTemp").insertAdjacentHTML("beforeend", `<div class="muted">${fails} fehlgeschlagene Abfrage(n) im Zeitraum</div>`);
}

// ---------------------------------------------------------------- Laden
async function loadState(){
  try { state = await (await fetch("/api/state")).json(); renderState(); }
  catch (e){ $("pill").className = "pill err"; $("pill").lastElementChild.textContent = "Dashboard-Server nicht erreichbar"; }
}
async function loadHist(){
  try { hist = await (await fetch("/api/history?hours=" + hours)).json(); renderHist(); } catch (e){}
}
$("refresh").onclick = async () => {
  $("refresh").disabled = true; $("refresh").textContent = "frage ab…";
  const before = state?.updated;
  await fetch("/api/refresh", {method: "POST"});
  for (let i = 0; i < 90; i++){ await new Promise(r => setTimeout(r, 1500)); await loadState(); if (state?.updated !== before) break; }
  await loadHist();
  $("refresh").disabled = false; $("refresh").textContent = "Jetzt abfragen";
};
document.querySelectorAll("#ranges button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#ranges button").forEach(x => x.classList.toggle("on", x === b));
  hours = +b.dataset.h; loadHist();
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderState(); renderHist(); }, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderState(); renderHist(); });
loadState(); loadHist();
setInterval(loadState, 15000);
setInterval(loadHist, 60000);
</script>
